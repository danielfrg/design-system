# Apps that copy files from public/v1. Run `pnpm sync` to update them,
# `pnpm sync --check` to see whether they have drifted.
#
# path    the app's repo, relative to this one
# dest    folder inside the app that is wholly owned by the sync (never edit it by hand)
# theme   a folder in public/v1 (ui-sdk, cadence): copied to <dest>/theme/
# custom  folders in public/v1/custom: copied to <dest>/custom/<name>/

[apps.golinks]
path = "../golinks"
dest = "frontend/src/design-system"
theme = "cadence"
custom = ["table", "theme-toggle"]

[apps.ciview]
path = "../ciview"
dest = "frontend/src/design-system"
theme = "cadence"
custom = ["theme-toggle"]

[apps.bookmarks]
path = "../bookmarks"
dest = "frontend/src/design-system"
theme = "cadence"
custom = ["table", "theme-toggle"]

[apps.bookmarks-extension]
path = "../bookmarks/extension"
dest = "src/design-system"
theme = "cadence"
custom = ["theme-toggle"]
